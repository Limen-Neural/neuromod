# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      # Cargo.toml rust-version is the crate's true MSRV and may be lower than
      # the dev toolchain pin (#214). Require rust-version <= rust-toolchain.toml
      # channel, and keep channel identical to this job's toolchain: input.
      # shell: bash so the awk script runs on Windows runners too.
      - name: Verify MSRV pins
        shell: bash
        run: |
          set -euo pipefail
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # Extract from the Install Rust step's `toolchain:` input (not a hardcoded mirror).
          ci_rv=$(awk '
            /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
            in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit
            }
            in_rt && /^[[:space:]]*- name:/ { exit }
          ' .github/workflows/ci.yml)
          test -n "$ci_rv"
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          # Dev pin: channel and CI toolchain input must stay identical.
          test "$toolchain_ch" = "$ci_rv"
          # Reject malformed values before comparing; only X.Y[.Z] is a
          # valid rust-version (no pre-release text or empty fields).
          echo "$cargo_rv" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          echo "$toolchain_ch" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          # MSRV must not exceed the dev toolchain (numeric compare; works on
          # macOS bash where `sort -V` is unavailable).
          awk -v a="$cargo_rv" -v b="$toolchain_ch" 'BEGIN {
            split(a, A, "."); split(b, B, ".");
            for (i = 1; i <= 3; i++) {
              if ((A[i] + 0) < (B[i] + 0)) exit 0;
              if ((A[i] + 0) > (B[i] + 0)) exit 1;
            }
            exit 0;
          }'

      - name: Rust Cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      # `cargo test` runs both unit tests and doctests. Keep it unconditional:
      # workflow, toolchain, and documentation-only changes are release inputs.
      - name: Test (unit tests and doctests)
        run: cargo test --locked --all-features

      # Keep the provenance generator's pinned upstream copy and committed
      # oracle tied together. It has a separate lockfile, so fetch that graph
      # while network access is available before exercising offline mode.
      - name: Verify Corinth parity fixture regeneration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path tests/reference/corinth_gif/Cargo.toml --locked
          cargo test --manifest-path tests/reference/corinth_gif/Cargo.toml --locked --offline
          generated=$(mktemp)
          trap 'rm -f "$generated"' EXIT
          cargo run --manifest-path tests/reference/corinth_gif/Cargo.toml --locked --release --offline > "$generated"
          cmp tests/reference/corinth_gif_parity.json "$generated"

      # Offline NIR -> neuromod interop smoke (issue #125). The harness is a
      # standalone crate with its own lockfile; it reads the two vendored
      # HF-derived .nir (HDF5) fixtures via nir-rs. The harness pins
      # `hdf5-metno` with the `static` + `zlib` features, so nir-rs's `hdf5`
      # dependency compiles a VENDORED static libhdf5 from source (via cmake) and
      # needs no system libhdf5. Installing `libhdf5-dev` here would be dead
      # weight: feature unification still selects the vendored build, so the apt
      # package is never linked. Keep the harness hermetic and install nothing.
      # No Hugging Face Hub download happens: loading is fully offline from the
      # checked-in fixtures.
      - name: NIR HuggingFace interop smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path tests/reference/nir_huggingface/Cargo.toml
          cargo clippy --manifest-path tests/reference/nir_huggingface/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tests/reference/nir_huggingface/Cargo.toml --locked

      - name: Release test regression suite
        if: runner.os == 'Linux'
        run: cargo test --locked --release --all-features

      # Debug already ran the same tests with overflow checks on. This rebuilds
      # just the lib tests with wrapping arithmetic so a regression to `+= 1`
      # cannot hide behind a debug panic. LTO is left off (dev profile).
      - name: Step-counter overflow semantics (overflow-checks off)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C overflow-checks=off"
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo test --all-features --lib step_counter_ 2>&1)"
          printf '%s\n' "$out"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' <<<"$out" || {
            echo 'error: no step_counter tests matched; overflow-checks-off guard would silently pass' >&2
            exit 1
          }

      - name: Feature matrix (cargo-hack)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-hack --locked
          cargo hack check --feature-powerset --exclude-no-default-features --keep-going

      - name: Check browser WASM entropy feature
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          cargo +1.99.0 check --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features wasm-js
          enabled_feature_tree=$(cargo +1.99.0 tree --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features wasm-js \
            --edges features \
            --invert getrandom@0.4.3)
          grep -F 'getrandom feature "wasm_js"' <<<"$enabled_feature_tree"
          no_feature_tree=$(cargo +1.99.0 tree --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --edges features \
            --invert getrandom@0.4.3)
          if grep -F 'getrandom feature "wasm_js"' <<<"$no_feature_tree"; then
            echo 'error: getrandom wasm_js feature is enabled without wasm-js' >&2
            exit 1
          fi

      - name: Verify docs are domain-agnostic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
          if grep -riE 'spikenaut|\bhft\b|\bmining\b|\bcrypto\b|eagle-lander' target/doc/neuromod/; then
            echo 'error: generated docs contain a forbidden domain term' >&2
            exit 1
          fi

      - name: Dependency audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Examples smoke (debug and release)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for example in basic basic_lif hebbian_learning rstdp_demo sparse_gif_layer; do
            cargo run --locked --example "$example"
            cargo run --locked --release --example "$example"
          done

      - name: Benchmarks compile
        if: runner.os == 'Linux'
        run: cargo bench --locked --no-run --all-features

      - name: Benchmarks smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bench in neuron_bench stdp_bench memory_bench modulation_bench; do
            cargo bench --locked --all-features --bench "$bench" -- --test
          done

      - name: Package dry run
        if: runner.os == 'Linux'
        run: cargo package --locked

      - name: Check Cargo package boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-package-boundary.sh

      # GH#82 / LIM-953: outsider demo must build with crates.io neuromod only.
      - name: Standalone crates.io demo
        if: runner.os == 'Linux'
        shell: bash
        working-directory: examples/crates-io-standalone
        run: |
          set -euo pipefail
          # No git / path deps in the demo manifest.
          if grep -E '^\s*(git|path)\s*=' Cargo.toml; then
            echo 'error: standalone demo must not use git or path dependencies' >&2
            exit 1
          fi
          cargo fmt --check
          cargo fetch
          source=$(cargo metadata --format-version 1 --offline \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['source'] for p in d['packages'] if p['name']=='neuromod'))")
          echo "neuromod source=$source"
          test "$source" = "registry+https://github.com/rust-lang/crates.io-index"
          cargo clippy --all-targets -- -D warnings
          cargo run
          cargo run --release

  # Dedicated MSRV job (#214): installs whatever Cargo.toml rust-version
  # declares instead of hardcoding a version, then checks and tests on it.
  # No clippy — an older rustc's clippy can flag lints that did not exist
  # when the code was written (e.g. uninlined_format_args on 1.88), so the
  # lint gate stays on the dev pin.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "$rv" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "invalid rust-version: $rv" >&2; exit 1; }
          echo "version=$rv" >> "$GITHUB_OUTPUT"
          echo "MSRV=$rv"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # RUSTUP_TOOLCHAIN keeps the cache's rustc/cargo probes on the MSRV
      # toolchain; without it rust-toolchain.toml's dev pin would install.
      - name: Rust Cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

      # `--all-targets` covers host targets; the browser-WASM check stays on
      # the dev pin (wasm builds are outside the MSRV claim).
      - name: Check and test on MSRV
        run: |
          cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets --all-features
          cargo +${{ steps.msrv.outputs.version }} test --locked --all-features

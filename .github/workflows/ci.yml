# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # Keep Cargo.toml rust-version, rust-toolchain.toml, and this job's
      # toolchain: string identical (MSRV single source of truth — #79).
      # ci_rv is parsed from the dtolnay/rust-toolchain `toolchain:` input above
      # so a bump of only that pin cannot silently pass this check.
      # shell: bash so the awk script runs on Windows runners too.
      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # Extract from the Install Rust step's `toolchain:` input (not a hardcoded mirror).
          ci_rv=$(awk '
            /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
            in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit
            }
            in_rt && /^[[:space:]]*- name:/ { exit }
          ' .github/workflows/ci.yml)
          test -n "$ci_rv"
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          test "$cargo_rv" = "$toolchain_ch"
          test "$cargo_rv" = "$ci_rv"

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      # `cargo test` runs both unit tests and doctests. Keep it unconditional:
      # workflow, toolchain, and documentation-only changes are release inputs.
      - name: Test (unit tests and doctests)
        run: cargo test --locked --all-features

      - name: Release test regression suite
        if: runner.os == 'Linux'
        run: cargo test --locked --release --all-features

      # Debug already ran the same tests with overflow checks on. This rebuilds
      # just the lib tests with wrapping arithmetic so a regression to `+= 1`
      # cannot hide behind a debug panic. LTO is left off (dev profile).
      - name: Step-counter overflow semantics (overflow-checks off)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C overflow-checks=off"
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo test --all-features --lib step_counter_ 2>&1)"
          printf '%s\n' "$out"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' <<<"$out" || {
            echo 'error: no step_counter tests matched; overflow-checks-off guard would silently pass' >&2
            exit 1
          }

      - name: Feature matrix (cargo-hack)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-hack --locked
          cargo hack check --feature-powerset --exclude-no-default-features --keep-going

      - name: Check browser WASM entropy feature
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          cargo +1.98.1 check --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features wasm-js
          enabled_feature_tree=$(cargo +1.98.1 tree --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features wasm-js \
            --edges features \
            --invert getrandom@0.4.3)
          grep -F 'getrandom feature "wasm_js"' <<<"$enabled_feature_tree"
          no_feature_tree=$(cargo +1.98.1 tree --locked \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --edges features \
            --invert getrandom@0.4.3)
          if grep -F 'getrandom feature "wasm_js"' <<<"$no_feature_tree"; then
            echo 'error: getrandom wasm_js feature is enabled without wasm-js' >&2
            exit 1
          fi

      - name: Verify docs are domain-agnostic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
          if grep -riE 'spikenaut|\bhft\b|\bmining\b|\bcrypto\b|eagle-lander' target/doc/neuromod/; then
            echo 'error: generated docs contain a forbidden domain term' >&2
            exit 1
          fi

      - name: Dependency audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Examples smoke (debug and release)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for example in basic basic_lif hebbian_learning rstdp_demo sparse_gif_layer; do
            cargo run --locked --example "$example"
            cargo run --locked --release --example "$example"
          done

      - name: Benchmarks compile
        if: runner.os == 'Linux'
        run: cargo bench --locked --no-run --all-features

      - name: Package dry run
        if: runner.os == 'Linux'
        run: cargo package --locked

      # GH#82 / LIM-953: outsider demo must build with crates.io neuromod only.
      - name: Standalone crates.io demo
        if: runner.os == 'Linux'
        shell: bash
        working-directory: examples/crates-io-standalone
        run: |
          set -euo pipefail
          # No git / path deps in the demo manifest.
          if grep -E '^\s*(git|path)\s*=' Cargo.toml; then
            echo 'error: standalone demo must not use git or path dependencies' >&2
            exit 1
          fi
          cargo fmt --check
          cargo fetch
          source=$(cargo metadata --format-version 1 --offline \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['source'] for p in d['packages'] if p['name']=='neuromod'))")
          echo "neuromod source=$source"
          test "$source" = "registry+https://github.com/rust-lang/crates.io-index"
          cargo clippy --all-targets -- -D warnings
          cargo run
          cargo run --release

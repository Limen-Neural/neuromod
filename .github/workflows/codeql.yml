# CodeQL static analysis
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [ 'rust' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a0cc0cdd9c70f8bff18ded8cf9571f9ee3a5b # v3.28.18
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff0a0cc0cdd9c70f8bff18ded8cf9571f9ee3a5b # v3.28.18

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff0a0cc0cdd9c70f8bff18ded8cf9571f9ee3a5b # v3.28.18
        with:
          category: "/language:${{matrix.language}}"

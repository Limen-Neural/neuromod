# Codecov coverage workflow (separate from main CI per observability split).
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
#
# Limen-Neural Codecov org allows tokenless uploads (no upload token required).
# Do not pass a stale CODECOV_TOKEN — wrong tokens return "Repository not found"
# and leave the README badge on "unknown". Optional: set CODECOV_TOKEN only if you
# re-enable required tokens in Codecov global upload settings.
name: Codecov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # pinned (taiki-e/install-action v2)
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Generate JUnit XML via nextest ci profile (.config/nextest.toml).
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # pinned (taiki-e/install-action v2)
        with:
          tool: nextest
          version: '0.9.70'

      # JUnit output via nextest profile (see .config/nextest.toml).
      - name: Run tests (JUnit)
        run: |
          cargo nextest run --all-features --profile ci
          cp target/nextest/ci/junit.xml junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: junit.xml
          # Tokenless: org setting allows uploads without a token.
          # Only pass secrets.CODECOV_TOKEN if required tokens are re-enabled.
          fail_ci_if_error: true

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          disable_search: true
          slug: Limen-Neural/neuromod
          fail_ci_if_error: true
          verbose: true

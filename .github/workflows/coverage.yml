# Codecov coverage workflow (separate from main CI per observability split).
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Codecov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # latest
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Generate JUnit XML by parsing nextest's libtest-json output.
      - name: Install nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: nextest
          version: '0.9.70'

      - name: Run tests (JUnit)
        run: |
          mkdir -p target/nextest/default
          cargo nextest run --all-features -E 'all()' --no-fail-fast \
            --message-format libtest-json 2>/dev/null | python3 -c "
          import sys, json, xml.etree.ElementTree as ET
          suite = ET.Element('testsuite', attrib={'name': 'neuromod', 'tests': '0', 'failures': '0'})
          tests = 0; failures = 0
          for line in sys.stdin:
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if obj.get('type') == 'test' and obj.get('event') in ('ok', 'failed', 'ignored'):
                  tests += 1
                  tc = ET.SubElement(suite, 'testcase', attrib={'name': obj.get('name', ''), 'time': str(obj.get('exec_time', 0))})
                  if obj['event'] == 'failed':
                      failures += 1
                      ET.SubElement(tc, 'failure', attrib={'message': obj.get('stdout', 'test failed')})
          suite.set('tests', str(tests))
          suite.set('failures', str(failures))
          ET.indent(suite)
          ET.ElementTree(suite).write('junit.xml', encoding='utf-8', xml_declaration=True)
          " || true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          slug: Limen-Neural/neuromod
          fail_ci_if_error: false
          verbose: true

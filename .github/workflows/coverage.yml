# Codecov coverage workflow (separate from main CI per observability split).
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
#
# Codecov requires CODECOV_TOKEN for this org (tokenless returns HTTP 400).
# Pass secrets.CODECOV_TOKEN; uploads are non-blocking (fail_ci_if_error: false).
name: Codecov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: checkout + upload only (no contents write).
permissions:
  contents: read

jobs:
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # pinned (taiki-e/install-action v2)
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # Generate JUnit XML via nextest ci profile (.config/nextest.toml).
      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # pinned (taiki-e/install-action v2)
        with:
          tool: nextest
          version: '0.9.70'

      # JUnit output via nextest profile (see .config/nextest.toml).
      - name: Run tests (JUnit)
        run: |
          cargo nextest run --all-features --profile ci
          cp target/nextest/ci/junit.xml junit.xml

      # test-results-action is deprecated; codecov-action handles test results
      # via report_type. A green step does not prove hosted delivery — check
      # https://app.codecov.io/gh/Limen-Neural/neuromod for the commit report.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit.xml
          report_type: test_results
          slug: Limen-Neural/neuromod
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          slug: Limen-Neural/neuromod
          token: ${{ secrets.CODECOV_TOKEN }}
          # Upload is observability, not a release gate; tokenless is broken.
          # An upload failure logs an error but leaves the job green — verify
          # hosted delivery on the Codecov dashboard, not the check status.
          fail_ci_if_error: false
          verbose: true
# Docker build + test (for #26)
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          tags: neuromod:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside container (example)
        run: |
          docker run --rm neuromod:test cargo test --all-features --quiet

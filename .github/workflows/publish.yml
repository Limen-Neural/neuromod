# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  verify:
    if: github.repository == 'Limen-Neural/neuromod' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/verify-release-tag.sh

      - name: Verify release commit is tested on main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/verify-release-commit.sh

      - name: Verify package
        run: cargo package --locked --all-features

      - name: Publish dry run
        run: cargo publish --locked --all-features --dry-run

  publish:
    needs: verify
    if: github.repository == 'Limen-Neural/neuromod' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.98.1 publish --locked --all-features --no-verify

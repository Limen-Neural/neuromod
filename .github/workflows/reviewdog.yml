# reviewdog for inline PR comments (clippy, rustfmt)
# Uses reviewdog/action-setup + direct invocation (the dedicated action-* repos for clippy/rustfmt no longer exist under those names).
name: reviewdog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: reviewdog/action-setup@19ad6fc8b7358ccdc9fd4a25c75dd93eeb097e1e # v1

      - name: reviewdog (clippy)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 | reviewdog -f=clippy -reporter=github-pr-review -level=warning -filter-mode=added

      - name: reviewdog (rustfmt)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if cargo fmt --check; then
            exit 0
          fi
          cargo fmt
          git diff | reviewdog -f=diff -reporter=github-pr-review -level=warning -filter-mode=added
          git checkout -- .
          exit 1

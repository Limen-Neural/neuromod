# reviewdog for inline PR comments (clippy, rustfmt, etc.)
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: reviewdog

on:
  pull_request:
    branches: [main]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: reviewdog (clippy)
        uses: reviewdog/action-clippy@3f3e08d6b1c3a9c9a7a8c0e1f5a2b3c4d5e6f7a8 # v1 (pinned SHA example; update to latest pinned)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          filter_mode: added
          fail_on_error: false

      - name: reviewdog (rustfmt)
        uses: reviewdog/action-rustfmt@e6f1c4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7 # v1 (pinned)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_on_error: false

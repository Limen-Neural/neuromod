# reviewdog for inline PR comments (clippy, rustfmt, etc.)
# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: reviewdog

on:
  pull_request:
    branches: [main]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: reviewdog (clippy)
        uses: reviewdog/action-clippy@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          filter_mode: added
          fail_on_error: false

      - name: reviewdog (rustfmt)
        uses: reviewdog/action-rustfmt@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_on_error: false

# reviewdog for inline PR comments (clippy, rustfmt)
# Uses reviewdog/action-setup + direct invocation (the dedicated action-* repos for clippy/rustfmt no longer exist under those names).
name: reviewdog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1

      - name: reviewdog (clippy)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo clippy --all-targets --all-features --message-format=short -- -D warnings 2>&1 | reviewdog -f=clippy -reporter=github-pr-review -level=warning -filter-mode=added

      - name: reviewdog (rustfmt)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if cargo fmt --check; then
            exit 0
          fi
          cargo fmt
          git diff | reviewdog -f=diff -reporter=github-pr-review -level=warning -filter-mode=added
          git checkout -- .
          exit 1

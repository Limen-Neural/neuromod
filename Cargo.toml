[package]
name = "neuromod"
version = "0.5.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
authors = ["Raul Montoya Cardenas <montoyaraul34@gmail.com>"]
description = "Biologically inspired SNN primitives in Rust: LIF/Izhikevich SpikingNetwork, neuromodulators, STDP building blocks, and standalone neuron models."
exclude = ["docs/", ".cubic/"]
repository = "https://github.com/Limen-Neural/neuromod"
readme = "README.md"
keywords = ["snn", "neuromorphic", "stdp", "spiking", "neuromodulation"]
categories = ["science", "algorithms", "simulation"]
homepage = "https://github.com/Limen-Neural/neuromod"
documentation = "https://docs.rs/neuromod"

[workspace]

[lib]
name = "neuromod"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.10.1"
sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "rustls", "transport"] }

[dev-dependencies]
criterion = "0.8.2"
temp-env = "0.3"

[[bench]]
name = "neuron_bench"
harness = false

[[bench]]
name = "stdp_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "modulation_bench"
harness = false


[features]
default = []
sentry = ["dep:sentry"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1          # faster-running debug binaries
incremental = true

[profile.release-with-debug]
inherits = "release"
debug = true           # for profiling release builds

[profile.bench]
inherits = "release"   # Criterion wall-clock benches use same LTO/codegen as release

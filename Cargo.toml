[package]
name = "neuromod"
version = "0.7.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
description = "Biologically inspired SNN primitives in Rust: LIF/Izhikevich SpikingNetwork, neuromodulators, STDP building blocks, and standalone neuron models."
exclude = [
    ".gitignore",
    "docs/",
    ".cubic/",
    ".codescene/",
    ".github/",
    ".devcontainer/",
    ".devin/",
    ".config/",
    "azure-templates/",
    ".deepsource.toml",
    ".codacy.yml",
    ".markdownlint.json",
    "codecov.yml",
    "AGENTS.md",
    "CLAUDE.md",
    "REVIEW.md",
    "benches/README.md",
    "examples/crates-io-standalone/",
    # Repository-only release and package-boundary checks.
    "scripts/",
    # Standalone parity-fixture generator (own empty [workspace] table). Kept
    # out of the published crate; it is a dev-only offline tool, not library code.
    "tests/reference/corinth_gif/",
    # Dev-only, offline, boundary-isolated NIR->neuromod interop smoke harness
    # (own empty [workspace] table). Kept out of the published crate; it depends
    # on nir-rs/hdf5, which neuromod must never gain.
    "tests/reference/nir_huggingface/",
]
repository = "https://github.com/Limen-Neural/neuromod"
readme = "README.md"
keywords = ["snn", "neuromorphic", "stdp", "spiking", "neuromodulation"]
categories = ["science", "algorithms", "simulation"]
homepage = "https://github.com/Limen-Neural/neuromod"
documentation = "https://docs.rs/neuromod"

[workspace]
# Nested outsider demo resolves `neuromod` from crates.io, not this path crate.
# The parity-fixture generator has its own empty [workspace] table too; excluding
# it here keeps `cargo build/test` in neuromod from ever absorbing it.
exclude = [
    "examples/crates-io-standalone",
    "tests/reference/corinth_gif",
    # Boundary-isolated NIR->neuromod interop smoke harness; its own workspace
    # root. Excluded so neuromod's build/test never absorbs it or its nir-rs/hdf5 deps.
    "tests/reference/nir_huggingface",
]

[lib]
name = "neuromod"
path = "src/lib.rs"

[features]
default = []
wasm-js = ["dep:getrandom", "getrandom/wasm_js"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.10.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
criterion = "0.8.2"
# Backward-compatibility tests deserialize pre-0.6 checkpoints that predate the
# `eligibility` / `stdp_config` fields. Already in the tree via criterion.
serde_json = "1.0"

[[bench]]
name = "neuron_bench"
harness = false

[[bench]]
name = "stdp_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "modulation_bench"
harness = false



[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1          # faster-running debug binaries
incremental = true

[profile.release-with-debug]
inherits = "release"
debug = true           # for profiling release builds

[profile.bench]
inherits = "release"   # Criterion wall-clock benches use same LTO/codegen as release

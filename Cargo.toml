[package]
name = "neuromod"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Raul Montoya Cardenas <montoyaraul34@gmail.com>"]
description = "A high-performance Rust SNN library for neuroscience research and pure spiking neural network library featuring LIF, Izhikevich, Hebbian, Nagumo, Lapicque and Hodgkin-Huxley dynamics."
exclude = ["docs/"]
repository = "https://github.com/Limen-Neural/neuromod"
readme = "README.md"
keywords = ["snn", "neuromorphic", "stdp", "spiking", "neuromodulation"]
categories = ["science", "algorithms", "simulation"]

[workspace]

[lib]
name = "neuromod"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.3"
sentry = { version = "0.48", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "rustls", "transport"] }

[dev-dependencies]
criterion = "0.5"
temp-env = "0.3"

[[bench]]
name = "neuron_bench"
harness = false

[[bench]]
name = "stdp_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "modulation_bench"
harness = false


[features]
default = []
sentry = ["dep:sentry"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

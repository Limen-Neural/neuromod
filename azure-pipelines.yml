# Azure Pipelines for cross-platform parity (Linux/Windows/macOS)
# Runs on PRs and main. Uses Microsoft-hosted agents.
# Three explicit jobs (not matrix) so GitHub gets one check per OS.
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main
  autoCancel: false
variables:
  CARGO_HOME: $(Pipeline.workspace)/.cargo
  RUSTUP_HOME: $(Pipeline.workspace)/.rustup
jobs:
- job: BuildTest_linux
  displayName: 'BuildTest linux'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - template: azure-templates/buildtest.yml

- job: BuildTest_mac
  displayName: 'BuildTest mac'
  pool:
    vmImage: 'macos-latest'
  steps:
  - template: azure-templates/buildtest.yml

- job: BuildTest_windows
  displayName: 'BuildTest windows'
  pool:
    vmImage: 'windows-latest'
  steps:
  - template: azure-templates/buildtest.yml